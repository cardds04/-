<!doctype html><html lang="ko"><head><title>강동롯데캐슬퍼스트 공간 둘러보기 · 핸디맨인테리어</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>롯데캐슬퍼스트 공간 둘러보기</title>

<style>
/* 시안 8번(도면 먼저 고르는 구성): PC = 왼쪽 도면·공간 목록 / 가운데 3D / 오른쪽 포인트 / 아래 전체 사진. 폰 = 도면 서랍 → 3D → 공간 단추 → 포인트 → 전체 사진 */

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1517; --card: #182124; --ink: #e7eef0; --muted: #96a5ab; --line: #2a373b; --soft: #1e2a2d;
  --accent: #3fc2ae; --accent-ink: #062621; --accent-soft: #1d4a43; --stage: #0b1012; --wall: #e7eef0; color-scheme: dark } }
:root[data-theme="dark"] {

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--display); font-size: 15px; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }

* { box-sizing: border-box; }
.app { display: grid; gap: 12px; padding-block: 12px 16px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); max-width: 1500px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }

/* 머리줄 */

.mini { display: block; width: 100%; height: auto; overflow: visible; --w: 2.4px; --t: 1px; -webkit-tap-highlight-color: transparent; }
.mini * { vector-effect: non-scaling-stroke; }

.mini .mm-room rect, .mini .mm-room path { fill: var(--card); stroke: none; }
.mini .mm-room { cursor: pointer; outline: none; }
.mini .mm-room:hover rect, .mini .mm-room:hover path, .mini .mm-room:focus-visible rect, .mini .mm-room:focus-visible path { fill: var(--accent-soft); }

.mini .wall path { fill: none; stroke: var(--wall); stroke-width: var(--w); stroke-linecap: square; stroke-linejoin: miter; }
.mini .win path { fill: none; stroke: var(--accent); stroke-width: calc(var(--w) + 1.6px); }

.jump button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; font-weight: 500; text-align: left; }
.jump button .k { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-weight: 400; }
.jump button::after { content: "›"; color: var(--muted); font-size: 18px; line-height: 1; }
.jump button:hover { border-color: var(--accent); }
.jump button[aria-current="true"] { background: var(--accent-soft); border-color: transparent; color: var(--ink); font-weight: 700; }
/* 3D 화면 */
.view { position: relative; overflow: hidden; background: var(--stage); }
.stage { position: relative; display: flex; align-items: center; justify-content: center; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; height: 100%; }
.stage.dragging { cursor: grabbing; }

.load { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 8px 14px; border-radius: 999px; background: rgba(10,16,18,.72); color: #fff; font-family: var(--mono); font-size: 12.5px; pointer-events: none; }
.arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; display: grid; place-items: center; border: 0; border-radius: 50%; background: rgba(10,16,18,.58); color: #fff; cursor: pointer; }
.arrow:hover { background: rgba(10,16,18,.8); } .arrow.l { left: 12px; } .arrow.r { right: 12px; } .arrow svg { width: 22px; height: 22px; }
.pill { position: absolute; bottom: 12px; display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px 7px 8px; border-radius: 999px; background: rgba(10,16,18,.62); color: #fff; font-size: 13px; pointer-events: none; }
.pill.ang { left: 12px; font-family: var(--mono); font-variant-numeric: tabular-nums; } .pill.tip { right: 12px; padding-left: 12px; }
.dial { width: 22px; height: 22px; } .dial .ring { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 2; } .dial .needle { stroke: #fff; stroke-width: 2.5; stroke-linecap: round; transform-origin: 20px 20px; } .dial .hub { fill: #fff; }
.bar2 { width: 46px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.35); position: relative; } .bar2 i { position: absolute; top: -3px; width: 11px; height: 11px; margin-left: -5px; border-radius: 50%; background: #fff; }
/* 360° 아이콘 = 코덱스가 그린 그림(시안/아이콘/360_a.png)을 틀로 써서 글자색으로 칠한다 */
.arrow.u, .arrow.d { left: 50%; top: auto; transform: translateX(-50%); width: 42px; height: 42px; }
.arrow.u { top: 12px; } .arrow.d { bottom: 12px; } .arrow.u[hidden], .arrow.d[hidden] { display: none; }
.stage.photo .arrow.u, .stage.photo .arrow.d { display: none; }
.i360 { display: inline-block; width: 36px; height: 26px; flex: none; color: var(--accent); background: currentColor;
  -webkit-mask: url(i360.png) center / contain no-repeat; mask: url(i360.png) center / contain no-repeat; }
.badge360 { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 22px 14px; border-radius: 18px;
  background: rgba(10,16,18,.6); color: #fff; font-size: 15px; font-weight: 600; pointer-events: none; transition: opacity .25s; text-align: center; white-space: nowrap; }
.badge360 .i360 { width: 104px; height: 76px; color: #fff; }
.stage:hover .badge360, .stage.seen .badge360, .stage.photo .badge360 { opacity: 0; }
.shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--stage); }
.shot[hidden] { display: none; } .shot, .zoom img { cursor: default; touch-action: none; transform-origin: 50% 50%; will-change: transform; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
.shot.zoomed, .zoom img.zoomed { cursor: grab; }
.stage.photo { overflow: hidden; } .zoom { overflow: hidden; }
.pill.zh { right: 12px; bottom: auto; top: 12px; padding-left: 12px; } .pill.zh[hidden] { display: none; }
.bigbtn { position: absolute; right: 12px; bottom: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px 8px 10px; border: 0; border-radius: 999px; background: rgba(10,16,18,.72); color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.bigbtn:hover { background: rgba(10,16,18,.9); } .bigbtn[hidden] { display: none; } .bigbtn svg { width: 16px; height: 16px; }
/* 사진 크게 보기(가운데 사진을 누르면 화면 전체로) */
.zoom { position: fixed; inset: 0; z-index: 40; background: rgba(5,8,9,.97); display: flex; align-items: center; justify-content: center; cursor: zoom-out;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.zoom[hidden] { display: none; }
.zoom img { max-width: 100%; max-height: 100%; object-fit: contain; }
.zoom .x { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: 12px; padding: 8px 14px; border-radius: 999px; border: 0; background: rgba(255,255,255,.16); color: #fff; cursor: pointer; font-weight: 600; }
.zoom .cnt { position: absolute; top: max(16px, env(safe-area-inset-top, 0px)); left: 16px; color: #fff; font-size: 14px; opacity: .85; }
.back360 { position: absolute; top: 12px; left: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px 7px 8px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13.5px; cursor: pointer; }
.back360 .i360 { color: var(--accent-ink); } .back360[hidden] { display: none; }
.stage.photo { cursor: default; } .stage.photo .pill.ang, .stage.photo .pill.tip { display: none; }
.pill.cap { left: 12px; padding-left: 12px; } .pill.cap[hidden] { display: none; }
.strip .to360 { display: grid; place-items: center; width: 68px; border: 2px solid var(--accent); background: var(--accent-soft); cursor: pointer; }
.strip .to360 .i360 { width: 50px; height: 36px; }
.jump button .i360 { margin-right: -2px; }
/* 공간 단추(폰) */
.chips { display: none; gap: 6px; overflow-x: auto; scrollbar-width: none; } .chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; font-size: 14px; }
.chip[aria-current="true"], .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
/* 포인트 */
.pts { padding: 16px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
.pts h2 { font-size: 18px; font-weight: 700; } .pts h2 em { font-style: normal; color: var(--accent); }
.pts .lead2 { font-size: 16px; font-weight: 600; line-height: 1.4; text-wrap: balance; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.pts ol { margin: 0; padding: 0; list-style: none; counter-reset: p; display: grid; }
.pts li { counter-increment: p; display: grid; grid-template-columns: 30px 1fr 88px; column-gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.pts li:last-child { border-bottom: 0; }
.pts li::before { content: counter(p, decimal-leading-zero); font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 0; text-align: center; margin-top: 2px; }
.pts li b { display: block; font-size: 15px; font-weight: 700; } .pts li span { display: block; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
.pts li .ph { grid-column: 3; width: 88px; height: 66px; padding: 0; border: 0; border-radius: 8px; overflow: hidden; background: var(--soft); cursor: zoom-in; }
.pts li .ph img { display: block; width: 100%; height: 100%; object-fit: cover; }
.pts .more { display: none; padding: 10px; border: 0; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-weight: 600; cursor: pointer; }
.pts .src { font-size: 11px; color: var(--muted); }

.photos { padding: 12px 16px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; align-items: center; }
.photos .ttl { grid-row: 1 / 3; align-self: start; padding-top: 4px; } .photos .ttl h2 { font-size: 16px; font-weight: 700; } .photos .ttl p { font-size: 12px; color: var(--muted); }
.frow { display: flex; align-items: center; gap: 8px; min-width: 0; } .filt { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; } .filt::-webkit-scrollbar { display: none; }
.nav { flex: none; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 18px; line-height: 1; }
.strip { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; padding-bottom: 4px; min-width: 0; scroll-behavior: smooth; }

.strip img { display: block; height: 100%; width: auto; }

.fine { font-size: 11px; line-height: 1.4; color: var(--muted); padding: 0 4px; }

.lb .pic { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }

.lb .strip { flex: none; padding: 10px 14px; } .lb .strip button { height: 56px; background: #1a2326; } .lb .strip button.cur { border-color: #fff; }
/* PC: 세 칸 + 아래 사진 줄, 한 화면에 다 들어오게 */
@media (min-width: 1000px) {
  .app { height: 100dvh; min-height: 640px; grid-template-columns: 300px minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "top top top" "plan view pts" "photos photos photos" "fine fine fine"; }
  .top { grid-area: top; } .plan { grid-area: plan; overflow: auto; } .view { grid-area: view; } .pts { grid-area: pts; } .photos { grid-area: photos; } .fine { grid-area: fine; }
  .stage canvas { max-height: 100%; }
}
/* 폰·좁은 화면: 위에서 아래로 */
@media (max-width: 999px) {
  .top { padding: 10px 14px; } .top .logo, .top .bar { display: none; }

  .plan-head { cursor: pointer; } .plan-head .chev { display: block; } .plan.open .plan-head .chev { transform: rotate(180deg); }
  .plan:not(.open) .plan-body { display: none; } .plan-body { background: var(--card); border-radius: 10px; padding: 12px; }
  .jump { display: none; }
  .stage canvas { max-height: min(66dvh, 680px); }
  .chips { display: flex; }
  .pts:not(.all) li:nth-child(n+3) { display: none; } .pts .more { display: block; }
  .photos { grid-template-columns: minmax(0, 1fr); } .photos .ttl { grid-row: auto; display: flex; align-items: baseline; gap: 8px; }
  .pill.tip { display: none; }
}
@media (prefers-reduced-motion: reduce) { .strip { scroll-behavior: auto; } }

  /* 사진 확대: 마우스 휠을 돌리거나 손가락 두 개로 벌리면 그 자리를 중심으로 커지고, 커진 상태에서는 끌어서 옮긴다. 두 번 누르면 원래 크기 */
