<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f2ec"><meta name="robots" content="noindex,nofollow">
<title>붙박이장 방 · 한스 송파레이크호반써밋</title>
<link rel="stylesheet" href="./room.css">
</head>
<body><main class="page">
<header><p class="project">한스 <span>／</span> 송파레이크호반써밋</p><div class="title-row"><h1>붙박이장 방</h1><div class="header-tools"><span class="mobile-source" id="mobile-source">현장 사진</span><button class="mode" id="mode" type="button" aria-pressed="false">원본 보기 <span aria-hidden="true">↗</span></button></div></div></header>
<div class="layout">
<section class="tour" aria-label="공간 둘러보기">
<div class="stage" id="stage" tabindex="0" role="group" aria-label="좌우로 끌어 공간 둘러보기">
<div class="native" id="native"></div><canvas id="bridge" hidden></canvas><img id="original" class="original" hidden alt="">
<span id="feedback" class="feedback" hidden></span>
</div>
<div class="control-bar" id="controls">
<button class="transport" id="previous" aria-label="조금 뒤로" type="button">‹</button>
<div class="track"><label for="scrub" class="sr">둘러보기 위치</label><input id="scrub" type="range" min="0" max="1000" step="1" value="0"></div>
<button class="transport" id="next" aria-label="조금 앞으로" type="button">›</button>
<button class="play" id="play" type="button" aria-label="자동 재생" aria-pressed="false"><span aria-hidden="true" class="playmark"></span><span id="playlabel">자동 재생</span></button>
</div>
<div class="photo-nav" id="photo-nav" hidden><button id="photo-prev" class="transport" type="button" aria-label="이전 원본 사진">‹</button><span id="photo-counter">1 / 3</span><button id="photo-next" class="transport" type="button" aria-label="다음 원본 사진">›</button></div>
</section>
<aside class="details">
<div class="location" id="location"><div class="current-line"><span class="signal"></span><span id="source">현장 사진</span></div><h2 id="scene">문 앞에서 본 창</h2></div>
<section class="gallery" aria-label="원본 사진 선택"><h3>원본 사진</h3><div class="thumbs" id="thumbs"></div></section>
</aside>
</div></main>
<script src="./room.js"></script><script src="./viewer.js"></script>
</body></html>
