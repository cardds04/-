<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#478af5"><title>우리 집 작은 친구</title><link rel="stylesheet" href="kitty-life.css?v=9"><link rel="stylesheet" href="kitty-life-polish.css?v=9"><link rel="stylesheet" href="kitty-life-playful.css?v=9"></head><body>
<main id="game">
 <div id="world" class="world pet-atlas"></div><div class="vignette"></div><div id="furnishings"></div>
 <header class="hud"><button id="profile" class="pet-card"><span class="pet-thumb pet-atlas"></span><span><b id="petName">Little Lives</b><small id="ageText">A new friend</small><span class="hud-xp"><i id="hudXp"></i></span><small id="hudXpText"></small></span></button><div class="wallet"><small>GOLD</small><b id="gold">45</b></div><button id="settings" class="round" aria-label="Settings"></button></header>
 <section class="growth"><button id="levelButton"><b id="level">Lv. 1</b><div class="xp-track"><i id="xp"></i></div><small id="xpText">0 / 80 XP</small></button><button id="scoreButton"><small>GROWTH</small><b id="score">0</b></button></section>
 <div id="needs" class="needs"></div><button id="goal" class="goal"></button>
 <button id="petHit" class="pet-hit" aria-label="Pet your friend"></button><div id="bubble" class="bubble" role="status">A little life. A big adventure.</div>
 <div id="prop" class="placed-prop" hidden></div><div id="particles" class="particles"></div>
 <div id="homePrompt" class="home-prompt"></div>
 <div class="home-activities"><button data-cmd="dailyTasks"><i data-icon="book"></i><b>오늘의 미션</b><small id="dailyCount">0 / 4</small></button><button data-cmd="growth"><i data-icon="trophy"></i><b>성장 기록</b><small id="growthCount">0점</small></button><button data-cmd="album"><i data-icon="heart"></i><b>컬렉션</b><small id="memoryCount">0장</small></button></div><button class="room-shortcut" data-cmd="decorate"><i data-icon="chair"></i>방 꾸미기</button><button class="room-rewards" data-cmd="dailyTasks"><i class="gift-art"></i><span>보상 보기!</span></button><nav class="dock"><button data-nav="care"><i data-icon="heart"></i><span>Care</span></button><button data-nav="out"><i data-icon="map"></i><span>산책하기</span></button><button data-nav="shop"><i data-icon="shop"></i><span>Shop</span></button><button data-nav="more"><i data-icon="gear"></i><span>More</span></button></nav><footer><span id="day">DAY 1</span><span id="slots">3 outings left</span><button id="sleep">Sleep & next day</button></footer>
 <section id="adoption" class="adoption" hidden></section>
 <section id="sheetLayer" class="sheet-layer" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><header><div><small id="sheetTag">LITTLE LIVES</small><h2 id="sheetTitle"></h2></div><button id="sheetClose" class="close" aria-label="Close">×</button></header><div id="sheetContent"></div></div></section>
 <section id="episode" class="episode" hidden><header><button id="episodeBack" class="round" aria-label="Pause story">‹</button><div><small id="episodePlace"></small><b id="episodeTitle"></b></div><span id="episodeCount"></span></header><div id="battleHud" class="battle-hud" hidden></div><div class="dialogue"><div class="speaker-row"><span id="speaker"></span><button id="listen" aria-label="Listen again"></button></div><p id="context" class="context"></p><p id="line" class="english"></p><div class="hint-row"><button id="hintButton">Help me say it</button><span id="preferenceNote"></span></div><p id="hint" class="hint" hidden></p><div id="choices" class="choices"></div><p id="feedback" class="feedback" role="status"></p><button id="nextLine" class="primary" hidden>Continue</button></div></section>
 <section id="playLayer" class="play-layer" hidden><div class="play-heading"><small>A LITTLE PLAYTIME</small><h2>Catch it together!</h2><b id="playCount">0 / 5</b><button id="endPlay" class="close" aria-label="Stop playing">×</button></div><button id="toyTarget" aria-label="Catch the toy"></button></section>
 <section id="townLayer" class="town-layer" hidden></section><section id="roomLayer" class="room-layer" hidden></section><div id="toast" class="toast" role="status" hidden></div>
</main><script src="scripts/kitty-life/data.js?v=9"></script><script src="scripts/kitty-life/ko.js?v=9"></script><script src="scripts/kitty-life/core.js?v=9"></script><script src="scripts/kitty-life/speech.js?v=9"></script><script src="assets/animal-town/models/pets.js?v=9"></script><script src="assets/animal-town/models/world.js?v=9"></script><script src="scripts/kitty-life/room3d.bundle.js?v=9"></script><script src="scripts/kitty-life/arcade.js?v=9"></script><script src="scripts/kitty-life/app.js?v=9"></script></body></html>
