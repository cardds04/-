<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#393323"><meta name="description" content="영어로 싸우고, 별빛을 되찾는 2D 모험. 퀘스트 보상으로 옷과 무기를 장착하세요."><title>별빛 원정대 · 영어 RPG</title><link rel="stylesheet" href="english-travel-rpg.css?v=20260908-9"><link rel="stylesheet" href="english-travel-fantasy.css?v=20260908-9"></head><body>
<main id="game"><canvas id="world" tabindex="0" aria-label="2D 모험 지도. 방향키 또는 WASD로 이동, E로 상호작용. 장소를 누르면 걸어갑니다."></canvas><div id="markers" aria-label="사람과 장소"></div>
<header class="hud"><button id="heroButton" class="hero-status" aria-label="캐릭터 장비 열기"><canvas id="portrait" width="52" height="60" aria-hidden="true"></canvas><span><b id="heroLevel">Lv.1 미나</b><span class="hp-track"><i id="hudHp"></i></span></span></button><div class="hud-right"><span class="gold"><span aria-hidden="true">◈</span> <b id="gold">0</b></span><button id="bagButton" class="square" aria-label="모험 가방 열기">▣</button><button id="soundButton" class="square sound-toggle" data-sound-toggle aria-label="소리 끄기">♪</button></div></header>
<button id="missionButton" class="mission"><span id="chapter">CH.01</span><b id="missionText">Mia에게 축제의 편지 받기</b><span aria-hidden="true">›</span></button>
<div class="location"><span class="location-dot"></span><span id="location">햇살 마을</span></div>
<div id="joystick" class="joystick" aria-label="이동 조이스틱"><i></i><span id="knob"></span></div><button id="interactButton" class="interact" hidden>대화하기 <span>E</span></button><button id="guideButton" class="guide">목적지로 ↗</button><div id="toast" role="status" aria-live="polite" hidden></div>
<section id="welcome" class="layer welcome" aria-labelledby="welcomeTitle"><div class="welcome-card"><div class="title-star" aria-hidden="true">✦</div><h1 id="welcomeTitle">별빛 원정대</h1><p>영어로 싸우고, 잃어버린 별빛을 되찾자.</p><div class="choose-hero"><button data-avatar="mina" aria-pressed="true"><canvas width="90" height="100"></canvas><span>미나</span></button><button data-avatar="jun" aria-pressed="false"><canvas width="90" height="100"></canvas><span>준</span></button></div><button id="startButton" class="primary">모험 시작 →</button></div></section>
<section id="dialog" class="layer bottom-layer" hidden><div class="dialog-card game-frame" role="dialog" aria-modal="true" aria-labelledby="dialogName">
<header class="dialog-top"><span class="panel-caption"><i aria-hidden="true">◆</i>대화</span><span id="dialogStep"></span><button class="sound-toggle" data-sound-toggle aria-label="소리 끄기"></button><button class="close" data-close aria-label="대화 닫기">×</button></header>
<p id="dialogContext" class="context"></p>
<div class="conversation"><div class="speech-turn npc-turn"><div class="speaker"><b id="dialogName">Mia</b><button id="dialogNpcListen" class="listen" aria-label="상대방 말 듣기">♪</button></div><p id="dialogEnglish" class="npc-en" lang="en"></p><p id="dialogKorean" class="translation"></p></div>
<div class="speech-turn player-turn taught-answer"><div class="speaker"><b id="dialogPlayerName">나</b><button id="dialogListen" class="listen" aria-label="내 대답 듣기">♪</button></div><div><strong id="dialogAnswer" lang="en"></strong><small id="dialogMeaning"></small></div></div></div>
<div class="dialog-actions"><button id="dialogMic" class="secondary" aria-label="대답 따라 말하기">따라 말하기</button><button id="dialogNext" class="primary">대답하기 ›</button></div><p id="dialogFeedback" class="feedback" role="status" hidden></p></div></section>
<section id="shop" class="layer shaded" hidden><div class="panel shop-panel" role="dialog" aria-modal="true" aria-labelledby="shopTitle"><header><div><h2 id="shopTitle">Ben의 무기점</h2></div><button class="close" data-close aria-label="상점 닫기">×</button></header><div class="shop-preview"><canvas id="shopHero" width="150" height="135" aria-label="장착 모습"></canvas><div><b id="previewName"></b><small id="previewStats"></small><span class="gold">◈ <b id="shopGold"></b> G</span></div></div><div id="shopItems" class="shop-items"></div></div></section>
<section id="bag" class="layer shaded" hidden><div class="panel bag-panel" role="dialog" aria-modal="true" aria-labelledby="bagTitle"><header><h2 id="bagTitle">모험 가방</h2><button class="close" data-close aria-label="가방 닫기">×</button></header><nav class="tabs"><button data-tab="gear" aria-pressed="true">캐릭터</button><button data-tab="journal">퀘스트</button><button data-tab="words">영어 수첩</button><button data-tab="map">지도</button></nav><div id="bagContent"></div></div></section>
<section id="battle" class="battle" hidden aria-label="영어 전투"><canvas id="battleCanvas" aria-hidden="true"></canvas><header class="battle-hud"><div><h2 id="enemyName"></h2><div class="enemy-hp"><i id="enemyHp"></i></div><small id="enemyHpText"></small></div><button id="fleeButton" class="secondary">물러나기</button></header><div class="fighter-status"><b id="battleLevel"></b><span id="battleHpText"></span><div class="hp-track"><i id="battleHp"></i></div></div><div id="battleFloat" class="battle-float" aria-live="polite"></div><div class="battle-card game-frame"><div class="battle-question-head"><span id="battleTier"></span><span id="battleCombo"></span><button class="sound-toggle" data-sound-toggle aria-label="소리 끄기"></button></div><p id="battleCue"></p><div class="battle-prompt-row"><p id="battlePrompt" lang="en"></p><button id="battlePromptListen" class="listen" aria-label="상대방 말 듣기"></button></div><div id="study"><div class="taught-answer"><div><strong id="studyAnswer" lang="en"></strong><small id="studyMeaning"></small></div><button id="studyListen" class="listen" aria-label="정답 듣기">♪</button></div><button id="recallButton" class="primary">기억했어요 · 공격 ›</button></div><div id="answerChoices" class="answer-choices" hidden></div><button id="hintButton" class="hint" hidden>답 다시 보기</button><div id="battleFeedback" class="battle-feedback" role="status" hidden></div><button id="battleNext" class="primary" hidden>다음 공격 →</button></div></section>
<section id="result" class="layer shaded" hidden><div class="result-card game-frame" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><header class="result-heading"><span id="resultIcon" class="result-icon" aria-hidden="true">✦</span><span id="resultKicker" class="panel-caption">퀘스트 완료</span></header><h2 id="resultTitle"></h2><p id="resultCopy"></p><div id="resultRewards" class="reward-pills"></div><button id="resultNext" class="primary">모험 계속 ›</button></div></section>
<div id="transition" class="transition" hidden><span>✦</span><b id="transitionName"></b></div></main><script src="english-travel-3d.bundle.js?v=20260908-9" defer></script></body></html>
