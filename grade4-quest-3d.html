<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff8ed" />
    <meta name="description" content="4학년 사회·과학 1·2학기를 그림·도식·비교자료와 문제로 차근차근 공부해요." />
    <title>4학년 사회·과학 · 차근차근 공부</title>
    <link rel="stylesheet" href="grade4-study.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">학습 내용으로 바로 가기</a>

    <div class="page-sparkles" aria-hidden="true">
      <span>✦</span><span>●</span><span>✿</span><span>✦</span><span>●</span>
    </div>

    <header class="site-header">
      <a class="back-link" href="study-game.html" aria-label="공부방으로 돌아가기">← 공부방</a>
      <a class="brand" href="grade4-quest-3d.html" aria-label="4학년 사회 과학 차근차근 공부 처음 화면">
        <span class="brand-mascot" aria-hidden="true">🐻</span>
        <span><strong>차근차근 4학년</strong><small>사회 · 과학 1·2학기</small></span>
      </a>
      <button class="header-progress" id="headerProgress" type="button" aria-label="전체 학습 진도 보기">
        <span id="headerProgressText">0 / 38</span>
        <small>배운 개념</small>
      </button>
    </header>

    <main id="app" tabindex="-1">
      <section class="loading-card" aria-live="polite">
        <div class="loading-bear" aria-hidden="true">🐻</div>
        <h1>공부책을 펼치는 중이에요</h1>
        <p>그림·비교자료·문제를 차례대로 준비하고 있어요.</p>
      </section>
    </main>

    <p class="sr-only" id="liveRegion" aria-live="polite" aria-atomic="true"></p>

    <dialog class="confirm-dialog" id="resetDialog" aria-labelledby="resetTitle">
      <form method="dialog">
        <div class="dialog-emoji" aria-hidden="true">🌱</div>
        <h2 id="resetTitle">처음부터 다시 공부할까요?</h2>
        <p>현재 아이의 문제 학습 기록만 지워져요. 다른 공부 기록은 그대로 남아 있어요.</p>
        <div class="dialog-actions">
          <button class="soft-button" value="cancel">아니요</button>
          <button class="danger-button" id="confirmReset" value="confirm">처음부터 시작</button>
        </div>
      </form>
    </dialog>

    <script src="grade4-study-data.js"></script>
    <script src="grade4-study-references-social.js"></script>
    <script src="grade4-study-references-science1.js"></script>
    <script src="grade4-study-references-science2.js"></script>
    <script src="grade4-study.js"></script>
  </body>
</html>
