<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3D 공간 사이트 업체 리스트</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#f3f5f7; --card:#fff; --ink:#17242a; --muted:#64748b; --line:#e2e8f0; --accent:#0f7a6c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 18px 16px 40px; }
  header { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  header h1 { font-size: 24px; margin: 0; flex:1; }
  header a { font-size: 15px; color: var(--accent); text-decoration: none; font-weight: 700; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 14px; }
  .bar input { flex:1; min-width: 180px; font-size: 17px; padding: 12px 14px; border:1px solid var(--line); border-radius: 12px; background:#fff; }
  .seg { display:flex; gap:6px; flex-wrap: wrap; }
  .seg button { font-size: 15px; padding: 10px 14px; border-radius: 999px; border:1px solid var(--line); background:#fff; cursor:pointer; font-weight:700; color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color:#fff; border-color: var(--ink); }
  .sum { color: var(--muted); font-size: 15px; margin: 0 0 10px; }
  .list { display:grid; gap: 10px; }
  .item { background: var(--card); border:1px solid var(--line); border-radius: 16px; padding: 16px; display:grid; gap: 10px; }
  .top { display:flex; align-items:center; gap: 8px; flex-wrap: wrap; }
  .name { font-size: 21px; font-weight: 800; }
  .date { color: var(--muted); font-size: 15px; }
  .tag { font-size: 13px; font-weight: 900; border-radius: 7px; padding: 3px 8px; }
  .paid { background:#dc2626; color:#fff; } .free { background:#e2e8f0; color:#475569; }
  .st-wait { background:#fef3c7; color:#92400e; } .st-done { background:#dcfce7; color:#166534; }
  .url { font-size: 16px; word-break: break-all; color: #1d4ed8; }
  .btns { display:flex; gap: 8px; flex-wrap: wrap; }
  .btns a, .btns button { font-size: 16px; font-weight: 800; padding: 12px 16px; border-radius: 12px; border: 0; cursor: pointer; text-decoration: none; }
  .copy { background: #ffd84d; color:#3a2e00; }
  .open { background: var(--ink); color: #fff; }
  .empty { padding: 40px 0; text-align:center; color: var(--muted); font-size: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>3D 공간 사이트 업체 리스트</h1>
    <a href="./">← 관리 화면</a>
  </header>
  <div class="bar">
    <input id="q" type="search" placeholder="업체명으로 찾기">
    <div class="seg" id="seg">
      <button type="button" data-f="all" aria-pressed="true">전체</button>
      <button type="button" data-f="done" aria-pressed="false">전달 대기</button>
      <button type="button" data-f="delivered" aria-pressed="false">전달 끝</button>
      <button type="button" data-f="paid" aria-pressed="false">유료</button>
      <button type="button" data-f="free" aria-pressed="false">무료</button>
    </div>
  </div>
  <p class="sum" id="sum">불러오는 중…</p>
  <div class="list" id="list"></div>
</div>
<script src="./sync-config.js"></script>
<script>
(function () {
  /* 11-19 사장님 「업체 리스트 게시판을 따로 만들어서, 관리 화면 업체 리스트를 누르면 여기로 — 너무 작아서 보기 힘들다」 */
  var C = window.SCHEDULE_SITE_SYNC_CONFIG || {};
  var H = { apikey: C.supabaseAnonKey, Authorization: "Bearer " + C.supabaseAnonKey };
  var all = [], f = "all";
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function md(d) { var m = String(d || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (+m[2]) + "/" + (+m[3]) : ""; }
  function render() {
    var q = document.getElementById("q").value.trim();
    var rows = all.filter(function (m) {
      if (q && String(m.company || "").indexOf(q) < 0) return false;
      if (f === "done") return m.status === "done";
      if (f === "delivered") return m.status === "delivered";
      if (f === "paid") return !!m.paid;
      if (f === "free") return !m.paid;
      return true;
    });
    document.getElementById("sum").textContent = "전체 " + all.length + "곳 · 전달 대기 " + all.filter(function (m) { return m.status === "done"; }).length + "곳 · 보이는 것 " + rows.length + "곳";
    document.getElementById("list").innerHTML = rows.length ? rows.map(function (m) {
      var u = esc(m.site_url);
      return '<div class="item"><div class="top">' +
        '<span class="tag ' + (m.paid ? "paid" : "free") + '">' + (m.paid ? "유료" : "무료") + '</span>' +
        '<span class="name">' + esc(m.company) + '</span>' +
        '<span class="date">' + md(m.date) + ' 촬영</span>' +
        '<span class="tag ' + (m.status === "done" ? "st-wait" : "st-done") + '">' + (m.status === "done" ? "고객 전달 대기" : "전달 끝") + '</span>' +
        '</div><a class="url" href="' + u + '" target="_blank" rel="noopener">' + u + '</a>' +
        '<div class="btns"><button type="button" class="copy" data-url="' + u + '">링크 복사</button><a class="open" href="' + u + '" target="_blank" rel="noopener">사이트 열기</a></div></div>';
    }).join("") : '<div class="empty">해당하는 업체가 없습니다.</div>';
  }
  document.getElementById("q").addEventListener("input", render);
  document.getElementById("seg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return; f = b.dataset.f;
    [].forEach.call(this.children, function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
    render();
  });
  document.getElementById("list").addEventListener("click", function (e) {
    var b = e.target.closest("button.copy"); if (!b) return; var u = b.dataset.url;
    (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).catch(function () { var t = document.createElement("textarea"); t.value = u; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); } catch (_) {} t.remove(); })
      .then(function () { var o = b.textContent; b.textContent = "복사됨 ✓"; setTimeout(function () { b.textContent = o; }, 1400); });
  });
  fetch(C.supabaseUrl + "/rest/v1/app_state?id=like.tour3d_%25&select=id,payload", { headers: H })
    .then(function (r) { return r.json(); })
    .then(function (rows) {
      all = (rows || []).map(function (r) { return r.payload || {}; })
        .filter(function (m) { return (m.status === "done" || m.status === "delivered") && m.site_url; })
        .sort(function (a, b) { return String(b.date || "").localeCompare(String(a.date || "")); });
      render();
    })
    .catch(function () { document.getElementById("sum").textContent = "목록을 불러오지 못했습니다. 새로고침해 주세요."; });
})();
</script>
</body>
</html>
