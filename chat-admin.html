<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>인로그 실시간 상담</title>
<style>
  :root{ --accent:#12b886; --accent-ink:#0b7a58; --ink:#1b241f; --sub:#6b7a72; --line:#e6ece9;
    --bg:#f4f7f6; --ai:#fff; --me:#12b886; --human:#eaf4ff; --human-ink:#0b4a7a; --hot:#dc4b2f; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);height:100vh;display:flex;flex-direction:column}
  .top{background:#0f1512;color:#eafff5;padding:11px 16px;display:flex;align-items:center;gap:9px;flex:0 0 auto}
  .top .dot{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#04231a;font-weight:900;font-size:12px}
  .top b{font-size:15px} .top .stat{margin-left:auto;font-size:12px;color:#8fdcc0;display:flex;gap:12px}
  .top .stat b{color:#fff}
  .wrap{flex:1 1 auto;display:flex;min-height:0}
  .list{width:340px;flex:0 0 auto;border-right:1px solid var(--line);background:#fff;overflow-y:auto}
  .conv{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .conv:hover{background:#f7faf9} .conv.on{background:#eef7f3;box-shadow:inset 3px 0 0 var(--accent)}
  .conv .l1{display:flex;align-items:center;gap:7px;margin-bottom:4px}
  .conv .nm{font-weight:800;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv .t{font-size:11px;color:var(--sub)}
  .conv .prev{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:10px;font-weight:800;color:#fff;border-radius:5px;padding:2px 6px}
  .badge.ai{background:#2f3e74} .badge.human{background:var(--human-ink)} .badge.hot{background:var(--hot)} .badge.closed{background:#8a978f}
  .pane{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
  .pane .ph{padding:11px 16px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .pane .ph .nm{font-weight:800}
  .pane .ph .btns{margin-left:auto;display:flex;gap:8px}
  .btn{border:none;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:800;cursor:pointer}
  .btn.join{background:var(--accent);color:#04231a} .btn.ai{background:#eef2f7;color:#54657c} .btn.close{background:#fbe9e4;color:var(--hot)}
  .body{flex:1 1 auto;display:flex;min-height:0}
  .chat{flex:1 1 auto;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:9px;background:var(--bg)}
  .msg{max-width:74%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .msg.ai{align-self:flex-start;background:var(--ai);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.human{align-self:flex-end;background:var(--human);color:var(--human-ink);border:1px solid #cfe4fa;border-bottom-right-radius:4px}
  .msg.user{align-self:flex-start;background:#e7f0ec;border-bottom-left-radius:4px}
  .who{font-size:10.5px;font-weight:800;color:var(--sub);margin:0 3px 2px}
  .side{width:230px;flex:0 0 auto;border-left:1px solid var(--line);background:#fff;padding:14px;overflow-y:auto;font-size:13px}
  .side h4{margin:0 0 8px;font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
  .side .kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
  .side .kv b{font-weight:700}
  .side .hot{background:#fdece7;color:var(--hot);border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:700;margin-bottom:10px;line-height:1.5}
  .compose{flex:0 0 auto;border-top:1px solid var(--line);background:#fff;padding:10px;display:flex;gap:8px}
  .compose textarea{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;font-size:14px;font-family:inherit;resize:none;max-height:100px}
  .compose textarea:disabled{background:#f4f7f6;color:#9aa7a1}
  .compose textarea:focus{outline:none;border-color:var(--accent)}
  .compose .send{width:42px;border:none;border-radius:12px;background:var(--accent);color:#04231a;font-size:17px;font-weight:900;cursor:pointer}
  .compose .send:disabled{background:#c9d6d0}
  .empty{flex:1;display:grid;place-items:center;color:var(--sub);font-size:14px}
  .hint{padding:8px 10px;background:#fff8e6;color:#8a6d1a;font-size:12px;text-align:center;border-bottom:1px solid #f0e2b8}
  @media(max-width:760px){
    .list{width:100%;display:block} .list.hide{display:none}
    .pane{display:none} .pane.show{display:flex} .side{display:none}
    .back{display:inline-block}
  }
  .back{display:none;background:none;border:none;color:var(--sub);font-weight:800;cursor:pointer;font-size:14px}
  .lock{position:fixed;inset:0;background:#0f1512;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
  .lock .dot{width:44px;height:44px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:#04231a;font-weight:900;font-size:16px}
  .lock h1{color:#eafff5;font-size:18px;margin:4px 0 2px}
  .lock p{color:#8fdcc0;font-size:13px;margin:0 0 8px}
  .lock input{width:220px;border:none;border-radius:12px;padding:14px 16px;font-size:18px;text-align:center;letter-spacing:6px;font-family:inherit}
  .lock input:focus{outline:2px solid var(--accent)}
  .lock button{width:220px;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:800;background:var(--accent);color:#04231a;cursor:pointer}
  .lock .err{color:#ff9d7a;font-size:12.5px;height:14px}
</style>
</head>
<body>
<div class="lock" id="lock">
  <div class="dot">IN</div>
  <h1>인로그 실시간 상담</h1>
  <p>관리자 비밀번호를 입력하세요</p>
  <input id="lockPw" type="password" inputmode="numeric" placeholder="••••" autocomplete="off" />
  <button id="lockBtn">입장</button>
  <div class="err" id="lockErr"></div>
</div>
<div class="top"><span class="dot">IN</span><b>실시간 상담</b>
  <span class="stat"><span>AI <b id="cAi">0</b></span><span>사람연결 <b id="cHot" style="color:#ff9d7a">0</b></span><span>내응대 <b id="cHuman">0</b></span></span>
</div>
<div class="wrap">
  <div class="list" id="list"></div>
  <div class="pane" id="pane">
    <div class="empty" id="empty">왼쪽에서 상담을 선택하세요</div>
    <div id="paneInner" style="display:none;flex-direction:column;height:100%">
      <div class="ph">
        <button class="back" id="back">← 목록</button>
        <span class="nm" id="pNm">상담</span>
        <span class="badge ai" id="pMode">AI</span>
        <span class="btns">
          <button class="btn join" id="joinBtn">대화 참여</button>
          <button class="btn ai" id="aiBtn" style="display:none">AI에게 다시</button>
        </span>
      </div>
      <div class="hint" id="hint" style="display:none"></div>
      <div class="body">
        <div class="chat" id="chat"></div>
        <div class="side" id="side"></div>
      </div>
      <div class="compose">
        <textarea id="cInput" rows="1" placeholder="[대화 참여]를 누르면 직접 답장할 수 있어요" disabled></textarea>
        <button class="send" id="cSend" disabled>↑</button>
      </div>
    </div>
  </div>
</div>
<script>
const SUPA='https://pidfkrxsgffoqstogmli.supabase.co';
const ANON='sb_publishable_0JHUt_yXZx78FwoqO8XCDg_s319cLiW';
const H={apikey:ANON,Authorization:'Bearer '+ANON};
const HJ={...H,'Content-Type':'application/json'};
let convs=[], cur=null, curSeen=new Set(), listTimer=null, msgTimer=null;

async function fetchConvs(){
  try{
    const r=await fetch(`${SUPA}/rest/v1/app_state?id=like.chatc_%25&select=id,payload`,{headers:H});
    if(!r.ok) return [];
    const rows=await r.json();
    return rows.map(x=>({token:(x.payload&&x.payload.token)||x.id.replace('chatc_',''),...(x.payload||{})}))
      .sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||'')));
  }catch(e){ return []; }
}
async function fetchMsgs(token){
  const r=await fetch(`${SUPA}/rest/v1/app_state?id=like.chatm_${encodeURIComponent(token)}_%25&select=id,payload`,{headers:H});
  if(!r.ok) return [];
  return (await r.json()).map(x=>({id:x.id,...(x.payload||{})})).sort((a,b)=>String(a.id).localeCompare(String(b.id)));
}
function leadName(c){
  const L=c.lead||{}; const bits=[L.region,L.space,L.area].filter(Boolean);
  return bits.length?bits.join(' '):'상담 '+String(c.token||'').slice(0,8);
}
function lastPrev(c){ return c._prev||'…'; }

async function renderList(){
  convs=await fetchConvs();
  // 마지막 메시지 미리보기(간단히 lead/handoff 기준)
  let ai=0,hot=0,human=0;
  const html=convs.map(c=>{
    const hotFlag = c.mode==='ai' && c.handoff;
    if(c.mode==='human') human++; else if(hotFlag) hot++; else if(c.mode==='ai') ai++;
    const badge = c.mode==='human'?'<span class="badge human">내응대</span>'
      : c.mode==='closed'?'<span class="badge closed">종료</span>'
      : hotFlag?'<span class="badge hot">사람연결</span>':'<span class="badge ai">AI</span>';
    const t=(c.updated_at||'').slice(11,16);
    const L=c.lead||{}; const prev=[L.purpose,L.concern].filter(Boolean).join(' · ')||(c.handoff_reason||'대화 중');
    return `<div class="conv ${cur===c.token?'on':''}" data-token="${c.token}">
      <div class="l1"><span class="nm">${esc(leadName(c))}</span>${badge}<span class="t">${t}</span></div>
      <div class="prev">${esc(prev)}</div></div>`;
  }).join('');
  document.getElementById('list').innerHTML=html||'<div class="empty" style="padding:30px">아직 상담이 없어요</div>';
  document.getElementById('cAi').textContent=ai;
  document.getElementById('cHot').textContent=hot;
  document.getElementById('cHuman').textContent=human;
  document.querySelectorAll('.conv').forEach(el=>el.addEventListener('click',()=>openConv(el.dataset.token)));
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function openConv(token){
  cur=token; curSeen=new Set();
  document.getElementById('empty').style.display='none';
  document.getElementById('paneInner').style.display='flex';
  document.getElementById('chat').innerHTML='';
  if(window.innerWidth<=760){ document.getElementById('list').classList.add('hide'); document.getElementById('pane').classList.add('show'); }
  document.querySelectorAll('.conv').forEach(el=>el.classList.toggle('on',el.dataset.token===token));
  await refreshConvHead();
  await refreshMsgs();
  if(msgTimer) clearInterval(msgTimer);
  msgTimer=setInterval(refreshMsgs,3000);
}
async function refreshConvHead(){
  const c=convs.find(x=>x.token===cur)||await (async()=>{ const r=await fetch(`${SUPA}/rest/v1/app_state?id=eq.chatc_${encodeURIComponent(cur)}&select=payload`,{headers:H}); const j=await r.json(); return j[0]&&{token:cur,...j[0].payload}; })();
  if(!c) return;
  document.getElementById('pNm').textContent=leadName(c);
  const badge=document.getElementById('pMode');
  badge.className='badge '+(c.mode==='human'?'human':c.mode==='closed'?'closed':c.handoff?'hot':'ai');
  badge.textContent=c.mode==='human'?'내응대 중':c.mode==='closed'?'종료':c.handoff?'사람연결 요청':'AI 응대 중';
  const human=c.mode==='human';
  document.getElementById('joinBtn').style.display=human?'none':'inline-block';
  document.getElementById('aiBtn').style.display=human?'inline-block':'none';
  document.getElementById('cInput').disabled=!human;
  document.getElementById('cSend').disabled=!human;
  document.getElementById('cInput').placeholder=human?'고객에게 보낼 답장을 입력하세요':'[대화 참여]를 누르면 직접 답장할 수 있어요';
  const hint=document.getElementById('hint');
  if(!human && c.handoff){ hint.style.display='block'; hint.textContent='⚡ 고객이 관심을 보였어요 — [대화 참여]로 직접 이어받으면 신뢰가 올라가요'; }
  else hint.style.display='none';
  // 사이드 요약
  const L=c.lead||{};
  const rows=[['목적',L.purpose],['공간',L.space],['지역',L.region],['평수',L.area],['희망일',L.date],['걱정',L.concern]]
    .filter(([,v])=>v).map(([k,v])=>`<div class="kv"><span>${k}</span><b>${esc(v)}</b></div>`).join('');
  document.getElementById('side').innerHTML=
    (c.handoff?`<div class="hot">사람 연결 필요<br><span style="font-weight:500">${esc(c.handoff_reason||'')}</span></div>`:'')
    +'<h4>고객 상황</h4>'+(rows||'<div class="kv"><span>아직 파악 중</span></div>');
}
async function refreshMsgs(){
  if(!cur) return;
  const msgs=await fetchMsgs(cur);
  const chat=document.getElementById('chat'); let added=false;
  for(const m of msgs){ if(curSeen.has(m.id)) continue; curSeen.add(m.id); added=true;
    const who=document.createElement('div'); who.className='who'; who.textContent=m.role==='user'?'고객':m.role==='human'?'나(담당자)':'AI';
    const d=document.createElement('div'); d.className='msg '+m.role; d.textContent=m.text;
    chat.appendChild(who); chat.appendChild(d);
  }
  if(added) chat.scrollTop=chat.scrollHeight;
  // 헤드/사이드도 주기 갱신(모드·lead 변화 반영)
  const fresh=await fetch(`${SUPA}/rest/v1/app_state?id=eq.chatc_${encodeURIComponent(cur)}&select=payload`,{headers:H}).then(r=>r.json()).catch(()=>null);
  if(fresh&&fresh[0]){ const idx=convs.findIndex(x=>x.token===cur); const merged={token:cur,...fresh[0].payload}; if(idx>=0) convs[idx]=merged; else convs.push(merged); await refreshConvHead(); }
}
async function setMode(mode){
  const r=await fetch(`${SUPA}/rest/v1/app_state?id=eq.chatc_${encodeURIComponent(cur)}&select=payload`,{headers:H});
  const j=await r.json(); const p=(j[0]&&j[0].payload)||{token:cur,mode:'ai',lead:{}};
  p.mode=mode; p.updated_at=new Date().toISOString();
  await fetch(`${SUPA}/rest/v1/app_state`,{method:'POST',headers:{...HJ,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{id:`chatc_${cur}`,payload:p}])});
  await refreshConvHead(); await renderList();
}
async function sendHuman(){
  const ta=document.getElementById('cInput'); const text=ta.value.trim(); if(!text) return;
  const btn=document.getElementById('cSend'); btn.disabled=true;
  const ts=Date.now(); const id=`chatm_${cur}_${String(ts).padStart(15,'0')}_${Math.random().toString(36).slice(2,6)}`;
  try{
    await fetch(`${SUPA}/rest/v1/app_state`,{method:'POST',headers:{...HJ,Prefer:'return=minimal'},body:JSON.stringify([{id,payload:{role:'human',text,ts}}])});
    ta.value='';
    await refreshMsgs();
  }catch(e){ alert('전송 실패, 다시 시도해 주세요'); }
  btn.disabled=false; ta.focus();
}

document.getElementById('joinBtn').addEventListener('click',()=>setMode('human'));
document.getElementById('aiBtn').addEventListener('click',()=>{ if(confirm('AI에게 다시 맡길까요? 이후 고객 메시지에 AI가 응답합니다.')) setMode('ai'); });
document.getElementById('cSend').addEventListener('click',sendHuman);
document.getElementById('cInput').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); sendHuman(); } });
document.getElementById('back').addEventListener('click',()=>{ document.getElementById('list').classList.remove('hide'); document.getElementById('pane').classList.remove('show'); if(msgTimer)clearInterval(msgTimer); cur=null; });

// ── 관리자 비밀번호 잠금 (6315) ──
const ADMIN_PW='6315';
function startApp(){
  document.getElementById('lock').style.display='none';
  renderList();
  listTimer=setInterval(renderList,5000);
}
function tryUnlock(){
  const v=document.getElementById('lockPw').value.trim();
  if(v===ADMIN_PW){ try{ sessionStorage.setItem('inlog_chat_admin_ok','1'); }catch(_){}
    startApp();
  } else {
    document.getElementById('lockErr').textContent='비밀번호가 올바르지 않아요';
    document.getElementById('lockPw').value=''; document.getElementById('lockPw').focus();
  }
}
document.getElementById('lockBtn').addEventListener('click',tryUnlock);
document.getElementById('lockPw').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); tryUnlock(); } });
if(sessionStorage.getItem('inlog_chat_admin_ok')==='1'){ startApp(); }
else { document.getElementById('lockPw').focus(); }
</script>
</body>
</html>
